name: Bug report
description: Achilles crashed, gave a wrong result, or behaved differently from the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste API keys, tokens, or code you cannot share.**
        Scan output can contain snippets of your source: trim it first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: The exact `achilles ...` command, or the `uses: Warzuponus/achilles@...` step with its inputs (secrets removed).
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `achilles version` and `achilles doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options: [Local binary, Docker image, GitHub Action, Built from source]
    validations:
      required: true
