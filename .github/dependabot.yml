# Keeps the SHA-pinned actions, the digest-pinned base images and Go modules current.
# Updates are grouped per ecosystem and checked monthly, so each month is at most one
# PR per ecosystem: every PR costs a full CI run. Security updates, when they are
# enabled in the repository settings, do not wait for this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 } # let a new release age a week before proposing it
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 } # let a new release age a week before proposing it
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/deployments/*"]   # the all-in-one image and every tool image
    schedule: { interval: monthly }
    cooldown: { default-days: 7 } # let a new release age a week before proposing it
    groups:
      docker: { patterns: ["*"] }
    # Runtimes two tools break on (Tier-2 verify, 2026-10-15): Railroader on Ruby 3,
    # SpotBugs 4.9.3 on Java 25. Digest updates of the pinned versions still come.
    # PR CI does not build tool images; run Tier-2 verify on a docker update branch
    # (Actions -> Tier-2 verify -> Run workflow) before merging it.
    ignore:
      - dependency-name: ruby
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
