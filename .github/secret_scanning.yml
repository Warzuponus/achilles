# Paths GitHub secret scanning skips. Every entry here holds deliberately fake
# credentials: rule fixtures, eval fixtures, or tests that check Achilles finds,
# redacts or scrubs a secret. None of them is a working credential.
#
# Keep this list narrow. Add a path only after checking that every token in it
# is fake (a documented example value, a placeholder, or a made-up string), and
# never ignore a whole directory of production code. A real secret committed to
# a path listed here would not raise an alert.
paths-ignore:
  # Rule and eval fixtures: the files the secret rules are tested against.
  - "internal/config/testdata/rules/achilles-secrets.py"
  - "evals/detect/fixtures/secrets-config/**"
  # Tests that feed a fake token through redaction, scrubbing or detection.
  - "cmd/achilles/prreview_test.go"
  - "cmd/achilles/triage_flow_test.go"
  - "cmd/achilles/history_integration_test.go"
  - "internal/eval/detect_test.go"
  - "internal/fleet/fetch_test.go"
  - "internal/inventory/entrypoints_test.go"
  - "internal/issues/issues_test.go"
  - "internal/normalize/secrets_test.go"
  - "internal/redact/redact_test.go"
  - "internal/report/flow_test.go"
  - "internal/report/gitlab_test.go"
  - "internal/report/html_test.go"
  - "internal/report/lessons_test.go"
  - "internal/report/markdown_safe_test.go"
  - "internal/report/regression_test.go"
  - "internal/server/redact_test.go"
  - "internal/server/server_test.go"
  - "internal/triage/privacy_test.go"
  - "internal/triage/llm/anthropic_test.go"
  - "internal/triage/llm/anthropic_live_test.go"
  - "internal/triage/llm/check_test.go"
