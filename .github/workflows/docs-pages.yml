# Publish the user guides to GitHub Pages. Rebuilds docs/site.html from the
# markdown sources on every docs change and deploys it as the site root.
#
# One-time enable (repo admin): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". (No branch to pick — this workflow is the source.)
name: Docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render guides
        # Absolute repo links so `../DESIGN.md` etc. resolve on the hosted site.
        env:
          ACHILLES_DOCS_REPO_URL: https://github.com/${{ github.repository }}/blob/main
        run: |
          python3 -m pip install --quiet markdown
          python3 docs/build.py
          mkdir -p _site
          cp docs/site.html _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
