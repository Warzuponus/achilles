# Publish the user guides to GitHub Pages. Rebuilds docs/site.html from the
# markdown sources on every docs change and deploys it as the site root.
#
# One-time enable (repo admin): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". (No branch to pick — this workflow is the source.)
name: Docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Render guides
        # Absolute repo links so `../DESIGN.md` etc. resolve on the hosted site.
        env:
          ACHILLES_DOCS_REPO_URL: https://github.com/${{ github.repository }}/blob/main
        run: |
          python3 -m pip install --quiet markdown
          python3 docs/build.py
          mkdir -p _site
          cp docs/site.html _site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
