# Fails the build if any Go dependency is copyleft (AGPL / GPL / LGPL), enforcing
# the commercial-license posture: AGPL/GPL tools (e.g. TruffleHog) are invoked as
# separate-process containers, NEVER imported as Go modules (THIRD-PARTY.md).
# Permissive (MIT/Apache/BSD) and weak/file-level copyleft (MPL, "reciprocal") are
# allowed as imports.
name: License check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Install go-licenses (pinned)
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Fail on copyleft (AGPL/GPL/LGPL) Go imports
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go-licenses check ./... --disallowed_types=forbidden,restricted
      # The release archives and the image ship third_party/licenses/. It must name
      # exactly the modules the binaries link, at the versions in go.mod.
      - name: Shipped license texts match the linked modules
        run: scripts/collect-licenses.sh --check third_party/licenses ./cmd/...
