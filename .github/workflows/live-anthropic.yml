# Runs the native Anthropic client against the live Messages API: the key-gated
# tests in internal/triage/llm, then a full --ai scan of the bundled sample with
# --llm-provider anthropic. Needs the ACHILLES_TEST_ANTHROPIC_API_KEY repository
# secret; without it every step is skipped and the job passes. When
# ACHILLES_TEST_OPENROUTER_API_KEY is also set, the same scan runs through the
# OpenAI-compatible path (OpenRouter) and both reports are uploaded for comparison.
#
# Each run costs real money (cents for the tests, more for the scan), so it runs
# only when the client changes, and on demand.
name: Live Anthropic

on:
  pull_request:
    paths:
      - "internal/triage/llm/**"
      - ".github/workflows/live-anthropic.yml"
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Anthropic model ids for the tests (the scan uses the first)"
        default: "claude-opus-5-5"
      openrouter_model:
        description: "OpenRouter model id for the comparison scan"
        default: "anthropic/claude-opus-5.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACHILLES_TEST_ANTHROPIC_MODELS: ${{ inputs.models || 'claude-opus-5-5' }}
      OPENROUTER_MODEL: ${{ inputs.openrouter_model || 'anthropic/claude-opus-5.5' }}
    steps:
      - name: Key present?
        id: key
        env:
          ANTHROPIC_KEY: ${{ secrets.ACHILLES_TEST_ANTHROPIC_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.ACHILLES_TEST_OPENROUTER_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ACHILLES_TEST_ANTHROPIC_API_KEY is not set; skipping the live run"; fi
          if [ -n "$OPENROUTER_KEY" ]; then echo "openrouter=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.set == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.key.outputs.set == 'true'
        with:
          go-version: '1.27'
      - name: Live client tests
        if: steps.key.outputs.set == 'true'
        env:
          ACHILLES_TEST_ANTHROPIC_API_KEY: ${{ secrets.ACHILLES_TEST_ANTHROPIC_API_KEY }}
        run: go test -count=1 -v -run Live ./internal/triage/llm
      - name: Build and install opengrep
        if: steps.key.outputs.set == 'true'
        run: |
          go build -o bin/achilles ./cmd/achilles
          ./bin/achilles tools install opengrep
      - name: Scan the sample with the native client
        if: steps.key.outputs.set == 'true'
        env:
          ACHILLES_LLM_API_KEY: ${{ secrets.ACHILLES_TEST_ANTHROPIC_API_KEY }}
        run: |
          model="${ACHILLES_TEST_ANTHROPIC_MODELS%%,*}"
          ./bin/achilles --ai --deep-verify 2 --llm-provider anthropic --llm-model "$model" \
            --report-dir out/anthropic --json-report out/anthropic/scan.json examples/quickstart || true
          scripts/check-live-scan.sh out/anthropic/scan.json
      - name: Scan the sample through the OpenAI-compatible path (OpenRouter)
        if: steps.key.outputs.openrouter == 'true'
        env:
          ACHILLES_LLM_API_KEY: ${{ secrets.ACHILLES_TEST_OPENROUTER_API_KEY }}
        run: |
          ./bin/achilles --ai --deep-verify 2 --llm-provider openrouter --llm-model "$OPENROUTER_MODEL" \
            --report-dir out/openrouter --json-report out/openrouter/scan.json examples/quickstart || true
          scripts/check-live-scan.sh out/openrouter/scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.key.outputs.set == 'true'
        with:
          name: live-anthropic-reports
          path: out/
          if-no-files-found: ignore
