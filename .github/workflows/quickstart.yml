# Runs the compose quickstart end to end: build the all-in-one image, start
# PostgreSQL + the War Room + the auth proxy, scan the bundled vulnerable sample with
# every scanner required to run (--strict-tools), and check the findings show up in
# the War Room. If the quickstart in docs/containers.md rots, this fails.
name: Quickstart

on:
  pull_request:
    paths:
      - "deploy/compose/**"
      - "deployments/achilles/**"
      - "examples/quickstart/**"
      - "configs/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/quickstart.yml"
  push:
    branches: [main]
    paths:
      - "deploy/compose/**"
      - "deployments/achilles/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches upstream scanner/base-image breakage

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compose quickstart smoke test
        run: deploy/compose/smoke.sh
