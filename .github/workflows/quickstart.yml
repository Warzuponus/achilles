# Runs the compose quickstart end to end: build the all-in-one image, start
# PostgreSQL + the War Room + the auth proxy, scan the bundled vulnerable sample with
# every scanner required to run (--strict-tools), and check the findings show up in
# the War Room. If the quickstart in docs/containers.md rots, this fails.
name: Quickstart

# On a pull request it runs only when the image, the compose files or the sample
# change. A change to the Go code is checked once, when it reaches main, instead of
# on every push to every pull request: the job builds the whole image each time.
on:
  pull_request:
    paths:
      - "deploy/compose/**"
      - "deployments/achilles/**"
      - "scripts/collect-licenses.sh"
      - "third_party/**"
      - "examples/quickstart/**"
      - ".github/workflows/quickstart.yml"
  push:
    branches: [main]
    paths:
      - "deploy/compose/**"
      - "deployments/achilles/**"
      - "scripts/collect-licenses.sh"
      - "third_party/**"
      - "examples/quickstart/**"
      - "configs/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/quickstart.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches upstream scanner/base-image breakage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose quickstart smoke test
        run: deploy/compose/smoke.sh
