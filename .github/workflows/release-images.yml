# Publishes the all-in-one image to GitHub Container Registry for linux/amd64 and
# linux/arm64 when a version tag is pushed (v1.2.3). Two variants:
#   ghcr.io/<owner>/<repo>:<version>        full: scanners + Go toolchain
#   ghcr.io/<owner>/<repo>:<version>-slim   scanners only; does not scan Go (gosec fails loudly)
# A release tag (vX.Y.Z, nothing after it) also moves the floating tags `vX.Y` and
# `latest` (and `vX.Y-slim`, `latest-slim`), which is what a bare
# `docker run ghcr.io/<owner>/<repo>` pulls. Pre-releases (v1.2.3-rc1) and manual runs
# publish only their exact tag.
# Build provenance and an SBOM are attached by buildx. The image name derives from
# the repository, so a rename or fork needs no edit here.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish under (e.g. v0.1.0-rc1); manual runs are for dry runs of the pipeline"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write   # build provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            with_go: "true"
            suffix: ""
          - variant: slim
            with_go: "false"
            suffix: "-slim"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes with git; keep the token out of .git/config
      # The full multi-arch build (Go toolchain, two platforms under QEMU) filled the
      # runner's disk on v0.1.0-rc1 ("No space left on device"). Remove preinstalled
      # SDKs this job never uses before building.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h / | tail -1
      - name: Resolve image name and tags
        id: meta
        # The version reaches the script through the environment, never spliced into
        # it: a manual run's input is free text, and this job can write packages.
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *[!A-Za-z0-9._-]*|"") echo "::error::refusing odd-looking version: $VERSION"; exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${VERSION}${SUFFIX}"
          if [ "$EVENT" = "push" ] && printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            minor="${VERSION%.*}"
            tags="${tags},${image}:${minor}${SUFFIX},${image}:latest${SUFFIX}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/achilles/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            WITH_GO=${{ matrix.with_go }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          push: true
