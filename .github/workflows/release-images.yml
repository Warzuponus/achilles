# Publishes the all-in-one image to GitHub Container Registry for linux/amd64 and
# linux/arm64 when a version tag is pushed (v1.2.3). Two variants:
#   ghcr.io/<owner>/<repo>:<version>        full: scanners + Go toolchain
#   ghcr.io/<owner>/<repo>:<version>-slim   scanners only; does not scan Go (gosec fails loudly)
# Build provenance and an SBOM are attached by buildx. The image name derives from
# the repository, so a rename or fork needs no edit here.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish under (e.g. v0.1.0-rc1); manual runs are for dry runs of the pipeline"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write   # build provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            with_go: "true"
            suffix: ""
          - variant: slim
            with_go: "false"
            suffix: "-slim"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The full multi-arch build (Go toolchain, two platforms under QEMU) filled the
      # runner's disk on v0.1.0-rc1 ("No space left on device"). Remove preinstalled
      # SDKs this job never uses before building.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h / | tail -1
      - name: Resolve image name and version
        id: meta
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/achilles/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            WITH_GO=${{ matrix.with_go }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}${{ matrix.suffix }}
          provenance: true
          sbom: true
          push: true
