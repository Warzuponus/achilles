# Builds and publishes the downloadable `achilles` binaries (and checksums.txt, signed
# keylessly with cosign) to a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run manually (Actions -> Release -> Run workflow) for a SNAPSHOT dry run: it builds
# every archive exactly as a release would, signs and publishes nothing, and uploads
# dist/ as a workflow artifact you can download and inspect.
#
# The container images are published by release-images.yml on the same tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the release and upload assets
      id-token: write   # keyless cosign signature over checksums.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes with git; keep the token out of .git/config
          fetch-depth: 0   # goreleaser builds the changelog from tag history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # No build cache in a release: a cache written by another workflow run could
          # end up in the signed archives.
          cache: false
      - name: Test before publishing
        run: |
          go vet ./...
          go test ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes with git; keep the token out of .git/config
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # No build cache in a release: a cache written by another workflow run could
          # end up in the signed archives.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          # --snapshot publishes nothing and skips signing, so cosign is not needed.
          args: release --snapshot --clean --skip=sign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: achilles-snapshot-dist
          path: dist/
          retention-days: 7
