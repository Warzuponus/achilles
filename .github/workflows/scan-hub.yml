# Central scan hub: run a full, LLM-routed Achilles scan of ANOTHER repo from
# here, so the LLM key + routing live only in this repo — targets need no
# secrets and no workflow of their own. The LLM endpoint is any OpenAI-compatible
# service (Ollama Cloud below; change ACHILLES_LLM_BASE_URL / --llm-model for others).
#
# Cross-repo READ is granted by a GitHub App (Contents: Read) installed on the
# target repos; the workflow mints a short-lived installation token to check the
# target out. Results are uploaded as artifacts of THIS run. Nothing is written back
# to the target unless you tick `file_issues`, which mints a second token that also
# carries Issues: Write and files issues there. See DEPLOY.md → "Central scan hub".
#
# Prereqs (one-time, done by a repo/org admin — see DEPLOY.md):
#   secrets.ACHILLES_LLM_API_KEY      — API key for the LLM endpoint below
#   secrets.SCANNER_APP_ID            — the GitHub App's id
#   secrets.SCANNER_APP_PRIVATE_KEY   — the GitHub App's private key (.pem contents)
name: Achilles scan hub

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo to scan, name only (owner is this repository's owner)"
        required: true
      ref:
        description: "Branch/tag/SHA to scan (blank = default branch)"
        required: false
        default: ""
      file_issues:
        description: "Also open GitHub issues (with suggested fixes) in the target repo. Needs the App to have Issues: Write there."
        type: boolean
        required: false
        default: false

permissions:
  contents: read # only this repo; target access comes from the App token

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      ACHILLES_LLM_API_KEY: ${{ secrets.ACHILLES_LLM_API_KEY }}
      ACHILLES_LLM_BASE_URL: https://ollama.com/v1
    steps:
      # 1. This repo — provides the action, the tool registry, and the routing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2. A short-lived token scoped to JUST the target repo (Contents: Read).
      - name: Mint target-scoped token
        id: tok
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.SCANNER_APP_ID }}
          private-key: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target_repo }}

      # 3. Check the target out into ./target using that token.
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.target_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.tok.outputs.token }}
          path: target
          fetch-depth: 1

      # 3b. Only when asked to file issues: a second short-lived token that can also
      #     write issues on JUST the target repo. Needs Issues: Write on the App.
      - name: Mint issues-scoped token
        id: issues_tok
        if: ${{ inputs.file_issues }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.SCANNER_APP_ID }}
          private-key: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target_repo }}
          permission-contents: read
          permission-issues: write

      # 4. AI-verified scan of the target. Uses the in-repo action (./) at this
      #    checkout; routing = configs/models.ollama.yaml (this repo). The action
      #    uploads the report directory as the `achilles-report` artifact.
      - name: Achilles scan
        uses: ./
        with:
          version: source
          target: "target"
          mode: "commercial"
          llm-api-key: ${{ secrets.ACHILLES_LLM_API_KEY }}
          llm-base-url: https://ollama.com/v1
          llm-model: glm-5.2
          issues: ${{ inputs.file_issues }}
          github-token: ${{ steps.issues_tok.outputs.token || github.token }}
          args: >-
            --model-config configs/models.ollama.yaml
            --threat-model achilles-report/threatmodel.otm.json
            --repo ${{ github.repository_owner }}/${{ inputs.target_repo }}
