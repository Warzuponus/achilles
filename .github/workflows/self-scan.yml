# Achilles scans its own Go code (dogfooding), gating on findings NOT already in
# .achilles/baseline.json. Regenerate the baseline after intentional changes:
#   PATH="$(go env GOPATH)/bin:$PATH" ./bin/achilles \
#     --config configs/selfscan.yaml --exclude evals,examples \
#     --write-baseline .achilles/baseline.json .
name: Self scan

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write # for code-scanning upload (needs GitHub Advanced Security on private repos)

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 1.27.1 exactly, with GOTOOLCHAIN=local so go.mod cannot pull in a newer one:
      # this is the toolchain gosec type-checks with, and Go 1.27.2 changed the
      # compiler export-data format in a way no gosec release can read yet. On
      # 1.27.2 gosec skipped every analysis that needs types and this job passed
      # anyway. Move the pin (and drop this note) when gosec supports it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Install gosec (pinned)
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      - name: Build achilles
        run: go build -o bin/achilles ./cmd/achilles
      - name: Self-scan (gate on new findings)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # --exclude evals: evals/triage/testdata holds DELIBERATELY vulnerable
          # fixtures that are the eval harness's ground truth. gosec does not skip
          # testdata/ the way the go tool does, so without this the corpus reports
          # ~11 high-severity findings and gates its own repo. The fixtures are
          # never built or shipped; `make eval-gate` is what checks them.
          # --exclude examples: examples/quickstart is a deliberately vulnerable
          # sample for the compose quickstart (separate module, never shipped).
          # --strict-tools: this job has one scanner. If it cannot analyze the
          # code, "no new findings" means nothing and the job must fail.
          ./bin/achilles --config configs/selfscan.yaml --strict-tools \
            --baseline .achilles/baseline.json --exclude evals,examples \
            --sarif-report achilles.sarif --github --fail-on high .
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: achilles-sarif
          path: achilles.sarif
      # Best-effort: populate the Security tab. Requires GitHub Advanced Security
      # on private repos; continue-on-error so a repo without it still gates via
      # the step above.
      - name: Upload to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: achilles.sarif
