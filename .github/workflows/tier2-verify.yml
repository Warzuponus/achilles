# End-to-end verification of the Tier-2 scanners (SpotBugs+find-sec-bugs, Psalm)
# that can't be run on a dev laptop without Docker + the language runtimes.
# GitHub's runners have Docker, so this is where these tools actually get proven.
# Runs on demand and when the tool integration changes (heavy: builds images).
name: Tier-2 verify

on:
  workflow_dispatch:
  push:
    paths:
      - "deployments/**"
      - "verify/tier2/**"
      - "configs/tools.yaml"
      - ".github/workflows/tier2-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Verify Tier-2 scanners end-to-end
        run: verify/tier2/verify.sh
