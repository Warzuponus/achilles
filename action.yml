name: "Achilles SAST"
description: "LLM-assisted open-source SAST harness — scan a codebase and emit SARIF"
branding:
  icon: "shield"
  color: "purple"

inputs:
  target:
    description: "Path to scan"
    required: false
    default: "."
  mode:
    description: "License mode: oss | commercial"
    required: false
    default: "commercial"
  args:
    description: "Extra achilles flags (e.g. --baseline .achilles/baseline.json --fail-on high)"
    required: false
    default: "--sarif-report achilles.sarif --github"
  opengrep-version:
    description: "Pinned Opengrep version to install"
    required: false
    default: "v1.25.0"

outputs:
  sarif:
    description: "Path to the SARIF report"
    value: "achilles.sarif"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: "1.26"
    - name: Build achilles
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o /usr/local/bin/achilles ./cmd/achilles
    - name: Install baseline scanners (Go)
      shell: bash
      # The default profile expects gosec (Go SAST) + osv-scanner (SCA/dep vulns)
      # alongside Opengrep. Without these, --runner local silently degrades to an
      # Opengrep-only scan.
      run: |
        GOBIN=/usr/local/bin go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
        GOBIN=/usr/local/bin go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
    - name: Install baseline scanners (Trivy + Gitleaks)
      shell: bash
      # Non-Go baseline tools: Trivy (IaC/misconfig/secrets/SCA) + Gitleaks (secret
      # scanning). Same versions and sha256 pins as deployments/achilles/Dockerfile and
      # configs/tools.yaml; bump all three together.
      env:
        TRIVY_VERSION: "0.72.0"
        GITLEAKS_VERSION: "8.30.1"
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   TRIVY_ASSET=Linux-64bit; TRIVY_SHA=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
                       GL_ASSET=x64;   GL_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          Linux-ARM64) TRIVY_ASSET=Linux-ARM64; TRIVY_SHA=2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467
                       GL_ASSET=arm64; GL_SHA=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
          *) echo "::error::Achilles action supports Linux X64/ARM64 runners, not ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        dl="$(mktemp -d)"
        fetch() { curl -fsSL --retry 3 -o "$dl/$1" "$2"; echo "$3  $dl/$1" | sha256sum -c -; }
        fetch trivy.tgz    "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_ASSET}.tar.gz" "$TRIVY_SHA"
        fetch gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ASSET}.tar.gz" "$GL_SHA"
        tar -xzf "$dl/trivy.tgz"    -C /usr/local/bin trivy
        tar -xzf "$dl/gitleaks.tgz" -C /usr/local/bin gitleaks
    - name: Install Opengrep (pinned)
      shell: bash
      env:
        OPENGREP_VERSION: ${{ inputs.opengrep-version }}
      run: |
        set -euo pipefail
        # Retry: the upstream install.sh resolves versions via an UNAUTHENTICATED
        # call to api.github.com (60 req/hour per IP). Actions runners share egress
        # IPs, so a burst elsewhere makes this fail with "Failed to fetch available
        # versions from GitHub" — a flake, not a broken build. Observed ~1 in 100
        # runs; a re-run always succeeded, so a short backoff covers it.
        for attempt in 1 2 3; do
          if curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_VERSION}/install.sh" \
               | bash -s -- -v "${OPENGREP_VERSION}"; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::Opengrep install failed 3x (likely GitHub API rate limiting)." >&2
            exit 1
          fi
          echo "Opengrep install attempt $attempt failed; retrying in $((attempt * 20))s" >&2
          sleep $((attempt * 20))
        done
        # install.sh drops the binary at ~/.opengrep/cli/latest/opengrep
        echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
    - name: Verify Opengrep
      shell: bash
      run: opengrep --version # fails the job loudly if the install didn't land
    - name: Run achilles
      shell: bash
      # NOTE: flags must precede the target path (stdlib flag parsing).
      # Inputs arrive through env, never spliced into the script, so an input holding
      # shell syntax can't run commands. `args` is split on whitespace (newlines
      # included) without glob expansion; shell quoting inside it is not interpreted.
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_TARGET: ${{ inputs.target }}
      run: |
        read -r -d '' -a extra <<< "$INPUT_ARGS" || true
        achilles --mode "$INPUT_MODE" "${extra[@]}" "$INPUT_TARGET"
