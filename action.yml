name: "Achilles SAST"
description: "LLM-assisted open-source SAST harness — scan a codebase and emit SARIF"
branding:
  icon: "shield"
  color: "purple"

inputs:
  target:
    description: "Path to scan"
    required: false
    default: "."
  mode:
    description: "License mode: oss | commercial"
    required: false
    default: "commercial"
  args:
    description: "Extra achilles flags (e.g. --baseline .achilles/baseline.json --fail-on high)"
    required: false
    default: "--sarif-report achilles.sarif --github"
  opengrep-version:
    description: "Pinned Opengrep version to install"
    required: false
    default: "v1.25.0"

outputs:
  sarif:
    description: "Path to the SARIF report"
    value: "achilles.sarif"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - name: Build achilles
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o /usr/local/bin/achilles ./cmd/achilles
    - name: Install baseline scanners (Go)
      shell: bash
      # The default profile expects gosec (Go SAST) + osv-scanner (SCA/dep vulns)
      # alongside Opengrep. Without these, --runner local silently degrades to an
      # Opengrep-only scan.
      run: |
        GOBIN=/usr/local/bin go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
        GOBIN=/usr/local/bin go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
    - name: Install baseline scanners (Trivy + Gitleaks)
      shell: bash
      # Non-Go baseline tools: Trivy (IaC/misconfig/secrets/SCA) + Gitleaks (secret
      # scanning). Pinned to the same versions as configs/tools.yaml.
      run: |
        set -euo pipefail
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin v0.72.0
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C /usr/local/bin gitleaks
    - name: Install Opengrep (pinned)
      shell: bash
      env:
        OPENGREP_VERSION: ${{ inputs.opengrep-version }}
      run: |
        set -euo pipefail
        # Retry: the upstream install.sh resolves versions via an UNAUTHENTICATED
        # call to api.github.com (60 req/hour per IP). Actions runners share egress
        # IPs, so a burst elsewhere makes this fail with "Failed to fetch available
        # versions from GitHub" — a flake, not a broken build. Observed ~1 in 100
        # runs; a re-run always succeeded, so a short backoff covers it.
        for attempt in 1 2 3; do
          if curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_VERSION}/install.sh" \
               | bash -s -- -v "${OPENGREP_VERSION}"; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::Opengrep install failed 3x (likely GitHub API rate limiting)." >&2
            exit 1
          fi
          echo "Opengrep install attempt $attempt failed; retrying in $((attempt * 20))s" >&2
          sleep $((attempt * 20))
        done
        # install.sh drops the binary at ~/.opengrep/cli/latest/opengrep
        echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
    - name: Verify Opengrep
      shell: bash
      run: opengrep --version # fails the job loudly if the install didn't land
    - name: Run achilles
      shell: bash
      # NOTE: flags must precede the target path (stdlib flag parsing).
      run: achilles --mode "${{ inputs.mode }}" ${{ inputs.args }} "${{ inputs.target }}"
