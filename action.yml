name: "Achilles SAST"
description: "AI-verified security scan: open-source scanners, LLM review of every finding, a report, and GitHub issues with suggested fixes"
branding:
  icon: "shield"
  color: "purple"

# Smallest useful workflow (see examples/workflows/achilles.yml):
#
#   permissions: { contents: read, issues: write }
#   steps:
#     - uses: actions/checkout@v4
#     - uses: Warzuponus/achilles@v0.1.0
#       with:
#         llm-api-key: ${{ secrets.LLM_API_KEY }}
#         llm-provider: openrouter
#         llm-model: ${{ vars.LLM_MODEL }}
#         issues: "true"
#
# The action downloads a signed-checksum release binary and the pinned scanners; it
# does not compile anything unless you ask for `version: source`.

inputs:
  target:
    description: "Path to scan"
    required: false
    default: "."
  mode:
    description: >-
      License mode: `oss` (default; the CLI's default too) or `commercial`. `commercial`
      refuses any tool that is not commercial-safe, and also skips the downloaded
      community Opengrep rules, whose licence adds a Commons Clause: choose it when you
      scan other people's code as a paid service, and expect baseline-rule coverage only.
    required: false
    default: "oss"
  version:
    description: >-
      Achilles release to run: a tag such as v0.1.0, `latest`, or `source` (build from
      this action's checkout with Go; for testing the action itself). Empty uses the
      tag you pinned the action at, else `latest`.
    required: false
    default: ""

  # --- AI verification ---
  llm-api-key:
    description: "API key for the LLM provider. Pass it from a secret. Empty runs scanners only."
    required: false
    default: ""
  llm-provider:
    description: "LLM endpoint preset: openai | openrouter | ollama | anthropic. Or set llm-base-url."
    required: false
    default: ""
  llm-base-url:
    description: "OpenAI-compatible base URL (overrides llm-provider)."
    required: false
    default: ""
  llm-model:
    description: "Model name to use for the AI review (required when llm-api-key is set)."
    required: false
    default: ""
  ai:
    description: "Run the AI review: `auto` (when llm-api-key is set), `true`, or `false`."
    required: false
    default: "auto"
  llm-no-code:
    description: "Privacy mode: send the model rule names and locations only, never source code."
    required: false
    default: "false"

  # --- GitHub issues ---
  issues:
    description: "Open and maintain GitHub issues for findings, with suggested fixes. Needs `issues: write`."
    required: false
    default: "false"
  issues-min-severity:
    description: "Lowest severity to file: critical | high | medium | low"
    required: false
    default: "medium"
  issues-max:
    description: "Most new issues to open per run (highest severity first)."
    required: false
    default: "25"
  allow-public-issues:
    description: "Allow filing vulnerability details as issues in a PUBLIC repository."
    required: false
    default: "false"
  github-token:
    description: "Token used to file issues. The default works for the repository running the workflow."
    required: false
    default: ${{ github.token }}

  # --- gating and outputs ---
  fail-on:
    description: "Fail the job if a finding at or above this severity remains: critical | high | medium | low. Empty never fails on findings."
    required: false
    default: ""
  upload-report:
    description: "Upload the report directory as a workflow artifact."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning (needs `security-events: write`, and Advanced Security on private repos)."
    required: false
    default: "false"
  args:
    description: "Extra achilles flags, appended last so they override the defaults (e.g. --diff origin/main --baseline .achilles/baseline.json)"
    required: false
    default: ""

outputs:
  report-dir:
    description: "Directory holding report.html, report.md and achilles.sarif"
    value: ${{ steps.run.outputs.report-dir }}
  sarif:
    description: "Path to the SARIF report"
    value: ${{ steps.run.outputs.sarif }}
  exit-code:
    description: "achilles exit code: 0 clean, 1 gated by --fail-on, 2 error"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Check inputs
      shell: bash
      env:
        INPUT_AI: ${{ inputs.ai }}
        INPUT_KEY: ${{ inputs.llm-api-key }}
        INPUT_MODEL: ${{ inputs.llm-model }}
        INPUT_ISSUES: ${{ inputs.issues }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS_NAME" = "Windows" ]; then
          echo "::error::The Achilles action supports Linux and macOS runners. On Windows, run the release binary or the Docker image directly."
          exit 1
        fi
        if [ "$INPUT_AI" = "true" ] && [ -z "$INPUT_KEY" ]; then
          echo "::error::ai is true but llm-api-key is empty. Pass the key from a secret (secrets are not available to workflows triggered by forked pull requests)."
          exit 1
        fi
        if [ -n "$INPUT_KEY" ] && [ "$INPUT_AI" != "false" ] && [ -z "$INPUT_MODEL" ]; then
          echo "::error::llm-api-key is set but llm-model is empty. Set llm-model to a model your provider serves."
          exit 1
        fi
        if [ -z "$INPUT_KEY" ] && [ "$INPUT_AI" = "auto" ]; then
          echo "::notice::No llm-api-key: running the scanners only. Add llm-api-key (and llm-model) for AI-verified results."
        fi
        if [ "$INPUT_ISSUES" = "true" ]; then
          echo "::notice::issues is on: make sure the job has 'permissions: issues: write'."
        fi

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ inputs.version == 'source' }}
      with:
        go-version: "1.27"

    - name: Install Achilles
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        bindir="${RUNNER_TEMP}/achilles-bin"
        mkdir -p "$bindir"
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          if printf '%s' "$ACTION_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            version="$ACTION_REF"
          else
            version="latest"
          fi
        fi
        if [ "$version" = "source" ]; then
          (cd "$GITHUB_ACTION_PATH" && go build -trimpath -o "$bindir/achilles" ./cmd/achilles)
        else
          VERSION="$version" INSTALL_DIR="$bindir" sh "$GITHUB_ACTION_PATH/scripts/install.sh"
        fi
        echo "$bindir" >> "$GITHUB_PATH"
        echo "$HOME/.achilles/bin" >> "$GITHUB_PATH"

    - name: Install scanners
      shell: bash
      run: |
        set -euo pipefail
        # Hash-pinned downloads; fails closed on a checksum mismatch.
        achilles tools install
        achilles doctor || true

    - name: Run Achilles
      id: run
      shell: bash
      # Inputs reach the script through the environment only, never spliced into it,
      # so an input holding shell syntax cannot run commands. `args` is split on
      # whitespace without glob expansion; shell quoting inside it is not interpreted.
      # The step always exits 0 and reports achilles' exit code as an output, so the
      # upload steps below run even when the scan gates; the last step enforces it.
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_AI: ${{ inputs.ai }}
        INPUT_PROVIDER: ${{ inputs.llm-provider }}
        INPUT_BASE_URL: ${{ inputs.llm-base-url }}
        INPUT_MODEL: ${{ inputs.llm-model }}
        INPUT_NO_CODE: ${{ inputs.llm-no-code }}
        INPUT_ISSUES: ${{ inputs.issues }}
        INPUT_ISSUES_MIN: ${{ inputs.issues-min-severity }}
        INPUT_ISSUES_MAX: ${{ inputs.issues-max }}
        INPUT_ALLOW_PUBLIC: ${{ inputs.allow-public-issues }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ARGS: ${{ inputs.args }}
        ACHILLES_LLM_API_KEY: ${{ inputs.llm-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        report_dir="achilles-report"
        mkdir -p "$report_dir"
        flags=(--mode "$INPUT_MODE"
               --html-report "$report_dir/report.html"
               --markdown "$report_dir/report.md"
               --sarif-report "$report_dir/achilles.sarif"
               --github)
        if [ "$INPUT_AI" = "true" ] || { [ "$INPUT_AI" = "auto" ] && [ -n "$ACHILLES_LLM_API_KEY" ]; }; then
          flags+=(--ai --report-dir "$report_dir" --llm-model "$INPUT_MODEL")
          [ -n "$INPUT_PROVIDER" ] && flags+=(--llm-provider "$INPUT_PROVIDER")
          [ -n "$INPUT_BASE_URL" ] && flags+=(--llm-base-url "$INPUT_BASE_URL")
          [ "$INPUT_NO_CODE" = "true" ] && flags+=(--llm-no-code)
        fi
        if [ "$INPUT_ISSUES" = "true" ]; then
          flags+=(--file-issues --repo "$GITHUB_REPOSITORY"
                  --issues-min-severity "$INPUT_ISSUES_MIN" --issues-max "$INPUT_ISSUES_MAX")
          [ "$INPUT_ALLOW_PUBLIC" = "true" ] && flags+=(--allow-public-issues)
        fi
        [ -n "$INPUT_FAIL_ON" ] && flags+=(--fail-on "$INPUT_FAIL_ON")
        # shellcheck disable=SC2162
        read -r -d '' -a extra <<< "$INPUT_ARGS" || true
        # Flags go before the target so this also works with releases that only
        # parsed flags there; extras come last among them so they override the
        # defaults above.
        achilles "${flags[@]}" ${extra[@]+"${extra[@]}"} "$INPUT_TARGET"
        code=$?
        {
          echo "exit-code=$code"
          echo "report-dir=$report_dir"
          echo "sarif=$report_dir/achilles.sarif"
        } >> "$GITHUB_OUTPUT"
        if [ -f "$report_dir/report.md" ]; then
          { echo "## Achilles"; echo; cat "$report_dir/report.md"; } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: achilles-report
        path: achilles-report
        if-no-files-found: ignore

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: achilles-report/achilles.sarif

    - name: Enforce result
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        case "${CODE:-2}" in
          0) ;;
          1) echo "::error::Achilles: findings at or above the fail-on severity remain (see the report artifact and job summary)."; exit 1 ;;
          *) echo "::error::Achilles exited with code ${CODE:-unknown}; see the log above."; exit 1 ;;
        esac
