# Per-task model routing for open models on Ollama Cloud (an example; any
# OpenAI-compatible endpoint works the same way).
#
#   achilles --llm-base-url https://ollama.com/v1 --llm-model glm-5.2 \
#            --model-config configs/models.ollama.yaml ...
#
# The API key comes from ACHILLES_LLM_API_KEY (never checked in). --llm-model is the
# fallback for any task not routed below.
#
# Triage and judge are the measured pair: 94.4% balanced accuracy on the labeled
# corpus in evals/triage (18 cases, 3 repeats each), with 4 cases still flipping
# between repeats. The measurements, how the judge was chosen, and the candidates
# that were rejected are in evals/README.md ("Known limits"). They were
# taken on an earlier prompt version; re-run `make eval-verdict` before relying on
# the numbers, and after changing either model.
#
# The judge matters more than the triage model. One candidate refuted three quarters
# of the correct true-positive verdicts it was shown, which deleted real findings
# while its false-positive score looked perfect. Screen any replacement on that
# measure first (evals/README.md).
tasks:
  triage:
    model: minimax-m2.7
  judge:
    model: minimax-m3
  # The seats below are not measured by the eval corpus, which exercises triage and
  # judge only. Treat them as starting points.
  remediation:
    model: kimi-k2.6
  threat-model:
    model: kimi-k2.6
  review:
    model: minimax-m2.7
  sca:
    model: minimax-m2.7
