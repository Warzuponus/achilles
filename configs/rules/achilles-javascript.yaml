# Achilles rules for JavaScript and TypeScript - original, written for this project
# (Apache-2.0; not derived from the Semgrep registry), so they load in every license
# mode. Each rule is tested by internal/config/testdata/rules/achilles-javascript.js
# (opengrep --test). Keep this file ASCII-only: Opengrep reads rule files as ASCII.
#
# Request sources are Express-style: properties of an object named req or request.
rules:
  - id: achilles.javascript.command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Request data reaches a shell command. Characters such as ; | $( ) in it run
      other commands. Use execFile/spawn with an argument array and no shell.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command (OS Command Injection)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body|cookies|headers|signedCookies|files)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: require("child_process").exec($CMD, ...)
              - pattern: require("child_process").execSync($CMD, ...)
              - pattern: 'spawn($CMD, $ARGS, {..., shell: true, ...})'
              - pattern: 'child_process.spawn($CMD, $ARGS, {..., shell: true, ...})'
          - focus-metavariable: $CMD

  - id: achilles.javascript.reflected-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Request data is written into the response as HTML without escaping. A script in
      it runs in the victim's browser. Escape it (escape-html) or render it through a
      template engine that escapes by default.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation (Cross-site Scripting)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body|cookies|headers|signedCookies)$
    pattern-sanitizers:
      - pattern: escapeHtml(...)
      - pattern: escape(...)
      - pattern: validator.escape(...)
      - pattern: he.encode(...)
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: encodeURIComponent(...)
      - pattern: parseInt(...)
      - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($BODY)
              - pattern: $RES.write($BODY)
              - pattern: $RES.end($BODY)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - focus-metavariable: $BODY

  # A taint rule: HTML a page builds itself is the common case and is not flagged
  # (the earlier "any variable into innerHTML" version flagged every such line in
  # golang.org/x/tools); data an attacker can put in the page is.
  - id: achilles.javascript.dom-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Data from the URL, the referrer, a cookie, window.name, web storage or a
      postMessage is written into the page as HTML, so a script in it runs. Use
      textContent, or sanitize the HTML with DOMPurify.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation (Cross-site Scripting)"]
      category: security
    pattern-sources:
      - pattern-either:
          - pattern: location.$P
          - pattern: window.location.$P
          - pattern: document.location.$P
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.baseURI
          - pattern: document.referrer
          - pattern: document.cookie
          - pattern: window.name
          - pattern: localStorage.getItem(...)
          - pattern: sessionStorage.getItem(...)
          - pattern: new URLSearchParams(...)
          - pattern: new URL(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ($E) { ... })
              - pattern-inside: |
                  $W.addEventListener("message", ($E) => { ... })
              - pattern-inside: |
                  $W.onmessage = function ($E) { ... }
          - pattern: $E.data
    pattern-sanitizers:
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: encodeURIComponent(...)
          - pattern: encodeURI(...)
          - pattern: parseInt(...)
          - pattern: Number(...)
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(escape|sanitiz)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
              - pattern: $EL.innerHTML += $X
              - pattern: document.write($X)
              - pattern: document.writeln($X)
              - pattern: $EL.insertAdjacentHTML($POS, $X)
              - pattern: $J(...).html($X)
              - pattern: $J(...).append($X)
          - focus-metavariable: $X

  - id: achilles.javascript.sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Request data is built into an SQL string. Pass values as query parameters
      (db.query("... WHERE id = ?", [id])) instead.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command (SQL Injection)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body|cookies|headers)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
          - focus-metavariable: $SQL

  - id: achilles.javascript.path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A file path is built from request data. "../" in it reaches files outside the
      intended directory. Reduce it to a file name (path.basename), or check that the
      resolved path stays under the base directory.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory (Path Traversal)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body|cookies|headers)$
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.$FN($PATH, ...)
              - pattern: fsPromises.$FN($PATH, ...)
              - pattern: $RES.sendFile($PATH)
              - pattern: $RES.download($PATH, ...)
          - pattern-not: '$RES.sendFile($PATH, {..., root: $ROOT, ...}, ...)'
          - focus-metavariable: $PATH

  - id: achilles.javascript.ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      An outgoing request goes to a URL taken from the incoming request. An attacker
      can point it at internal services or cloud metadata endpoints. Allow only known
      hosts.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body|cookies|headers)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
              - pattern: needle.get($URL, ...)
          - focus-metavariable: $URL

  - id: achilles.javascript.open-redirect
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      The response redirects to a URL taken from the request, so a link to this site
      can send a user anywhere (phishing that looks like your domain). Redirect only
      to known paths.
    metadata:
      cwe: ["CWE-601: URL Redirection to Untrusted Site (Open Redirect)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|params|body)$
    pattern-sinks:
      - patterns:
          - pattern: $RES.redirect($URL)
          - focus-metavariable: $URL

  - id: achilles.javascript.code-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A string is compiled and run as code. If any of it comes from input, that input
      can run anything. Parse the data instead.
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (Eval Injection)"]
      category: security
    pattern-either:
      - patterns:
          - pattern: new Function(..., $BODY)
          - pattern-not: new Function(..., "...")
          - pattern-not: Function(..., "...")
      - patterns:
          - pattern-either:
              - pattern: vm.runInNewContext($CODE, ...)
              - pattern: vm.runInThisContext($CODE, ...)
              - pattern: vm.runInContext($CODE, ...)
          - pattern-not: vm.$RUN("...", ...)

  - id: achilles.javascript.nosql-where-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A MongoDB $where clause is built from a variable. $where runs its string as
      JavaScript on the database server, so input in it can read or change any
      document, or tie up the server. Use ordinary query operators ($eq, $gt) with
      the values as data instead.
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      category: security
    patterns:
      - pattern-either:
          - pattern: '{..., $where: $V, ...}'
          - pattern: '{..., "$where": $V, ...}'
      # A fixed string or function is the application's own query.
      - pattern-not: '{..., $where: "...", ...}'
      - pattern-not: '{..., "$where": "...", ...}'
      - pattern-not: '{..., $where: function (...) { ... }, ...}'
      # A number cannot carry JavaScript (Juice Shop's chatbot reads reviews with
      # `const productId = Number(id)` and then `'this.product == ' + productId`).
      - pattern-not: '{..., $where: $S + Number(...), ...}'
      - pattern-not: '{..., $where: $S + parseInt(...), ...}'
      - pattern-not-inside: |
          $N = Number(...);
          ...
          <... {..., $where: $S + $N, ...} ...>;
      - pattern-not-inside: |
          $N = parseInt(...);
          ...
          <... {..., $where: $S + $N, ...} ...>;

  - id: achilles.javascript.nosql-operator-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A request value is used as a field of a MongoDB query filter. A JSON body or a
      query string can carry an object there ({"$ne": null}), which turns the match
      into "any document", so one request reads, changes or deletes every record.
      Convert it first (String(id)), or compare with {$eq: value}.
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      category: security
    pattern-sources:
      # Only the body and the query string: Express parses both into objects. Route
      # parameters and headers are always strings.
      - patterns:
          - pattern: $REQ.$PART
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(query|body)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: String(...)
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
          - pattern: $X.toString()
          - pattern: new ObjectId(...)
          - pattern: ObjectId(...)
      # A hash or a sanitizer returns a string (mongo-sanitize removes "$" keys).
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(hash|sanitiz|escape)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '$COLL.$METHOD({..., $KEY: $V, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(find|findOne|findOneAndDelete|deleteOne|deleteMany|remove|count|countDocuments|exists)$
              # An update takes a filter and then the change. With one argument it
              # is an ORM instance's own update (Sequelize's user.update({...})).
              - patterns:
                  - pattern-inside: '$COLL.$METHOD({..., $KEY: $V, ...}, $CHANGE, ...)'
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(update|updateOne|updateMany|findOneAndUpdate|findOneAndReplace|replaceOne)$
          # Sequelize, TypeORM and Prisma take {where: {...}}, and reject an object
          # where a value belongs instead of reading it as an operator.
          - pattern-not-inside: '$COLL.$M({..., where: $W, ...}, ...)'
          # $where has its own rule, and {$eq: value} is the safe form.
          - metavariable-regex:
              metavariable: $KEY
              regex: ^(?!["']?\$where["']?$)
          - pattern: $V
          # Rejecting anything but a string first is the other safe form (Juice
          # Shop's correct fix for its review update).
          - pattern-not-inside: |
              if (typeof $V !== 'string') { ... }
              ...
          - pattern-not-inside: |
              if (typeof $V != 'string') { ... }
              ...
          - pattern-not: '{$eq: $X}'
          - pattern-not: '{"$eq": $X}'

  - id: achilles.javascript.angular-sanitizer-bypass
    languages: [typescript, javascript]
    severity: WARNING
    message: >
      Angular's sanitizer is switched off for a value that is not a fixed string, so
      any markup or script in it reaches the page as is. Bind the value without
      bypassSecurityTrust*, or sanitize it (DOMPurify.sanitize) first.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation (Cross-site Scripting)"]
      category: security
    patterns:
      - pattern: $S.$BYPASS($X)
      - metavariable-regex:
          metavariable: $BYPASS
          regex: ^bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)$
      - pattern-not: $S.$BYPASS("...")
      - pattern-not: $S.$BYPASS(DOMPurify.sanitize(...))

  - id: achilles.javascript.directory-listing
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      serve-index lists the files in a directory to anyone who asks, including
      backups, logs and keys nobody meant to publish. Serve only the files that
      should be public, without a listing.
    metadata:
      cwe: ["CWE-548: Exposure of Information Through Directory Listing"]
      category: security
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $SI from 'serve-index'
                  ...
              - pattern-inside: |
                  import * as $SI from 'serve-index'
                  ...
              - pattern-inside: |
                  $SI = require('serve-index')
                  ...
          - pattern: $SI(...)
      - pattern: require('serve-index')(...)
      # The name its documentation imports it under, for code that gets it from
      # elsewhere.
      - pattern: serveIndex(...)

  - id: achilles.javascript.rate-limit-key-from-header
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      The rate limiter counts requests by a header the client writes itself
      (X-Forwarded-For, Forwarded, X-Real-IP), so a new value on each request starts
      a new count and the limit never applies. Key on req.ip, with Express's "trust
      proxy" set to the proxies you run.
    metadata:
      cwe: ["CWE-348: Use of Less Trusted Source"]
      category: security
    patterns:
      - pattern-inside: '$RL({...})'
      - pattern-either:
          - pattern-inside: '{..., keyGenerator: $KG, ...}'
          - pattern-inside: |
              keyGenerator(...) { ... }
      - metavariable-regex:
          metavariable: $RL
          regex: ^(rateLimit|RateLimit|slowDown)$
      - pattern-either:
          - pattern: $H[$NAME]
          - pattern: $R.get($NAME)
          - pattern: $R.header($NAME)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^["'](x-forwarded-for|forwarded|x-real-ip|x-client-ip|true-client-ip|cf-connecting-ip)["']$

  - id: achilles.javascript.unsafe-deserialization
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      node-serialize's unserialize() runs functions embedded in the input. Use
      JSON.parse for data from outside.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
    pattern-either:
      - pattern: require("node-serialize").unserialize(...)
      - patterns:
          - pattern-inside: |
              $S = require("node-serialize")
              ...
          - pattern: $S.unserialize(...)

  - id: achilles.javascript.tls-verification-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      TLS certificate verification is turned off, so anyone on the network path can
      impersonate the server. Keep verification on; pass a CA (ca: ...) if the
      server uses a private one.
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
    pattern-either:
      - pattern: |
          {..., rejectUnauthorized: false, ...}
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: achilles.javascript.weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      A broken algorithm is used: MD5 and SHA-1 for hashing, or DES, RC4 or ECB mode
      for encryption. Use SHA-256 or better, a password hash (bcrypt, scrypt, argon2)
      for passwords, and AES-GCM for encryption.
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      category: security
    pattern-either:
      - patterns:
          - pattern: crypto.createHash($ALG)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'](md5|md4|sha1|sha-1)["']$
      - patterns:
          - pattern-either:
              - pattern: crypto.createCipheriv($ALG, ...)
              - pattern: crypto.createDecipheriv($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'](des|des-ede|des-ede3|rc2|rc4|bf|blowfish)[^"']*["']$|(?i)^["'][^"']*-ecb["']$
      - pattern: crypto.createCipher(...)

  - id: achilles.javascript.template-autoescape-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      HTML escaping is turned off for the template engine, so every value a template
      prints is raw markup, and any of them that holds user input is XSS. Leave
      autoescaping on and mark only trusted, sanitized HTML as safe.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation (Cross-site Scripting)"]
      category: security
    pattern-either:
      - pattern: "$SWIG.setDefaults({..., autoescape: false, ...})"
      - pattern: "new $SWIG.Swig({..., autoescape: false, ...})"
      - pattern: "nunjucks.configure(..., {..., autoescape: false, ...}, ...)"
      - pattern: "new nunjucks.Environment($LOADER, {..., autoescape: false, ...})"
      - pattern: "$HB.compile($T, {..., noEscape: true, ...})"
      - pattern: "$ENGINE({..., noEscape: true, ...})"
