# Achilles rules for Python - original, written for this project (Apache-2.0; not
# derived from the Semgrep registry), so they load in every license mode. Each rule
# is tested by internal/config/testdata/rules/achilles-python.py (opengrep --test).
# Keep this file ASCII-only: Opengrep reads rule files as ASCII.
#
# Request sources cover Flask, Django and Starlette/FastAPI request objects.
rules:
  - id: achilles.python.sql-string-building
    languages: [python]
    severity: ERROR
    message: >
      SQL is built by string formatting and passed to execute(). Any part of it that
      comes from input can change the query. Pass values as parameters
      (cursor.execute("... WHERE name = ?", (name,))) instead.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command (SQL Injection)"]
      category: security
    pattern-either:
      - pattern: $DB.execute(f"...{$X}...", ...)
      - pattern: $DB.executemany(f"...{$X}...", ...)
      - pattern: $DB.execute("..." % $X, ...)
      - pattern: $DB.execute("...".format(...), ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute($X + "...", ...)
      - patterns:
          - pattern-inside: |
              $Q = f"...{$X}..."
              ...
          - pattern: $DB.execute($Q, ...)
      - patterns:
          - pattern-inside: |
              $Q = "..." + $X
              ...
          - pattern: $DB.execute($Q, ...)
      - patterns:
          - pattern-inside: |
              $Q = "..." % $X
              ...
          - pattern: $DB.execute($Q, ...)

  - id: achilles.python.sql-injection-orm-raw
    languages: [python]
    severity: ERROR
    message: >
      A raw SQL string built from a variable is passed to the ORM. Use the ORM's
      query API, or pass values as parameters (params=[...]).
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command (SQL Injection)"]
      category: security
    pattern-either:
      - pattern: $M.objects.raw(f"...{$X}...", ...)
      - pattern: $M.objects.raw("..." % $X, ...)
      - pattern: $M.objects.raw("..." + $X, ...)
      # Built first, then passed (pygoat builds the query in a variable).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $Q = f"...{$X}..."
                  ...
              - pattern-inside: |
                  $Q = "..." + $X
                  ...
              - pattern-inside: |
                  $Q = "..." + $X + $Y
                  ...
              - pattern-inside: |
                  $Q = "..." % $X
                  ...
              - pattern-inside: |
                  $Q = "...".format(...)
                  ...
          - pattern: $M.objects.raw($Q, ...)
      - pattern: $M.objects.extra(where=[..., f"...{$X}...", ...], ...)
      - pattern: sqlalchemy.text(f"...{$X}...")
      - pattern: text(f"...{$X}...")

  - id: achilles.python.os-command
    languages: [python]
    severity: ERROR
    message: >
      A shell command is built from a variable. Anything in it that comes from input
      can run other commands. Use subprocess.run([...]) with an argument list and no
      shell.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command (OS Command Injection)"]
      category: security
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: commands.getoutput($CMD)
              - pattern: commands.getstatusoutput($CMD)
          - pattern-not: os.system("...")
          - pattern-not: os.popen("...", ...)
          - pattern-not: commands.getoutput("...")
          - pattern-not: commands.getstatusoutput("...")

  - id: achilles.python.code-injection-exec
    languages: [python]
    severity: ERROR
    message: >
      exec() runs a string as Python code. If any of it comes from input, that input
      can run anything. Parse the data instead of executing it.
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (Eval Injection)"]
      category: security
    patterns:
      - pattern: exec($CODE, ...)
      - pattern-not: exec("...", ...)

  - id: achilles.python.path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      A file path is built from request data. "../" in it reaches files outside the
      intended directory. Reduce it to a file name (werkzeug.utils.secure_filename,
      os.path.basename) or check the resolved path stays under the base directory.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory (Path Traversal)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: safe_join(...)
      - pattern: werkzeug.utils.safe_join(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: send_file($PATH, ...)
              - pattern: flask.send_file($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: shutil.rmtree($PATH, ...)
              - pattern: pathlib.Path($PATH)
              - pattern: Path($PATH)
              - pattern: FileResponse($PATH, ...)
          - focus-metavariable: $PATH

  - id: achilles.python.ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      An outgoing request goes to a URL taken from the incoming request. An attacker
      can point it at internal services or cloud metadata endpoints. Allow only known
      hosts.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($URL, ...)
              - pattern: httpx.$METHOD($URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urlopen($URL, ...)
              - pattern: aiohttp.ClientSession().$METHOD($URL, ...)
          - focus-metavariable: $URL

  - id: achilles.python.template-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Request data is compiled as a template. Template syntax in it runs on the
      server. Pass the data to a fixed template as a variable instead.
    metadata:
      cwe: ["CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: render_template_string($T, ...)
              - pattern: flask.render_template_string($T, ...)
              - pattern: jinja2.Template($T, ...)
              - pattern: Template($T, ...)
              - pattern: $ENV.from_string($T, ...)
          - focus-metavariable: $T

  - id: achilles.python.untrusted-deserialization
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Request data is deserialized with pickle (or a format built on it). Unpickling
      attacker-controlled bytes runs attacker-chosen code. Use JSON for data from
      outside.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pickle.loads($D, ...)
              - pattern: pickle.load($D, ...)
              - pattern: cPickle.loads($D, ...)
              - pattern: dill.loads($D, ...)
              - pattern: marshal.loads($D, ...)
              - pattern: jsonpickle.decode($D, ...)
              - pattern: yaml.unsafe_load($D, ...)
          - focus-metavariable: $D

  - id: achilles.python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >
      yaml.load() without a safe loader can construct arbitrary Python objects from
      the document. Use yaml.safe_load().
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=CSafeLoader, ...)

  - id: achilles.python.weak-hash
    languages: [python]
    severity: WARNING
    message: >
      MD5 and SHA-1 are broken for security use: collisions are practical and they
      are far too fast for passwords. Use hashlib.sha256 for integrity, and a password
      hash (bcrypt, scrypt, argon2, hashlib.pbkdf2_hmac) for passwords. If this is not
      a security use, say so with usedforsecurity=False.
    metadata:
      cwe: ["CWE-328: Use of Weak Hash"]
      category: security
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
          - pattern: hashlib.new("MD5", ...)
          - pattern: hashlib.new("SHA1", ...)
      - pattern-not: hashlib.$H(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new(..., usedforsecurity=False, ...)

  - id: achilles.python.tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: >
      TLS certificate verification is turned off, so anyone on the network path can
      impersonate the server. Keep verification on; point verify= at a CA bundle if
      the server uses a private CA.
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: achilles.python.flask-debug
    languages: [python]
    severity: WARNING
    message: >
      The Flask debugger is on. Its console runs arbitrary Python for anyone who can
      reach it. Read the setting from the environment and keep it off in production.
    metadata:
      cwe: ["CWE-489: Active Debug Code"]
      category: security
    pattern: $APP.run(..., debug=True, ...)

  # Taint form of the SQL rules above: request data reaching a query however the
  # string was put together (any number of pieces, built in one place and run in
  # another), which the shape-matching rules cannot follow.
  - id: achilles.python.sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Request data reaches an SQL query, so the input can change it. Pass values as
      parameters (cursor.execute("... WHERE id = %s", [user_id]),
      Model.objects.raw("... WHERE id = %s", [user_id])) or use the ORM's query API.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command (SQL Injection)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: uuid.UUID(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.execute($Q, ...)
              - pattern: $C.executemany($Q, ...)
              - pattern: $C.executescript($Q)
              - pattern: $M.objects.raw($Q, ...)
              - pattern: $M.raw($Q, ...)
              - pattern: sqlalchemy.text($Q)
              - pattern: text($Q)
          - focus-metavariable: $Q

  - id: achilles.python.reflected-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Request data is written into an HTML response, or marked safe for a template,
      without escaping, so a script in it runs in the user's browser. Render it
      through a template with autoescaping on, or escape it (html.escape,
      markupsafe.escape, django.utils.html.escape) first.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation (Cross-site Scripting)"]
      category: security
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|GET|POST|COOKIES|FILES|META|body|query_params|path_params)$
      - pattern: request.get_json(...)
      - pattern: request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: escape(...)
          - pattern: html.escape(...)
          - pattern: markupsafe.escape(...)
          - pattern: flask.escape(...)
          - pattern: conditional_escape(...)
          - pattern: format_html(...)
          - pattern: bleach.clean(...)
          - pattern: json.dumps(...)
          - pattern: urllib.parse.quote(...)
          - pattern: quote(...)
          # Rendered through a template, which escapes what it prints.
          - pattern: render_to_string(...)
          - pattern: render_template(...)
          - pattern: flask.render_template(...)
          - pattern: $TPL.render(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: HttpResponse($X, ...)
              - pattern: django.http.HttpResponse($X, ...)
              - pattern: make_response($X, ...)
              - pattern: flask.make_response($X, ...)
              - pattern: mark_safe($X)
              - pattern: Markup($X)
              - pattern: markupsafe.Markup($X)
              - pattern: SafeString($X)
          # A declared non-HTML type (text/plain, JSON) is not rendered as markup.
          - pattern-not: HttpResponse($X, ..., content_type=$T, ...)
          - pattern-not: django.http.HttpResponse($X, ..., content_type=$T, ...)
          - focus-metavariable: $X

  # A signing key in the source signs every session cookie and token: whoever reads
  # the repository can forge them. Any literal counts, however short or
  # placeholder-like, because the framework will use whatever it is given.
  - id: achilles.python.hardcoded-signing-key
    languages: [python]
    severity: WARNING
    message: >
      The framework's signing key is a literal in the source. Anyone who can read it
      can forge session cookies and signed tokens. Read it from the environment or a
      secret store (os.environ["SECRET_KEY"]), and rotate this one.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - pattern: $APP.config["JWT_SECRET_KEY"] = "..."
      - pattern: $APP.config.update(..., SECRET_KEY="...", ...)
      - patterns:
          - pattern: $NAME = "..."
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(SECRET_KEY|JWT_SECRET_KEY|SIGNING_KEY|SECRET_COOKIE_KEY|SESSION_SECRET|JWT_SECRET)$
          # Django's own test settings and the like are not deployed.
          - pattern-not-inside: |
              if $COND:
                ...
      - pattern: jwt.encode($P, "...", ...)
      - pattern: jwt.decode($T, "...", ...)
    paths:
      exclude: ["test_*.py", "*_test.py", "tests/", "conftest.py"]

  - id: achilles.python.xxe
    languages: [python]
    severity: ERROR
    message: >
      The XML parser is told to resolve external entities, so a document can read
      local files or make the server fetch URLs. Leave external entities off, or
      parse untrusted XML with defusedxml.
    metadata:
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      category: security
    pattern-either:
      - pattern: $P.setFeature(feature_external_ges, True)
      - pattern: $P.setFeature(feature_external_pes, True)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_pes, True)
      - pattern: $P.setFeature(handler.feature_external_ges, True)
      - pattern: $P.setFeature(handler.feature_external_pes, True)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ..., no_network=False, ...)
      - pattern: etree.XMLParser(..., resolve_entities=True, ..., no_network=False, ...)
      - pattern: etree.XMLParser(..., no_network=False, ..., resolve_entities=True, ...)
