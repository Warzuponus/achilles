# Achilles rules for credentials in source - original, written for this project
# (Apache-2.0). They complement gitleaks with two shapes its generic rules miss.
# Tested by internal/config/testdata/rules/achilles-secrets.py (opengrep --test).
# Keep this file ASCII-only: Opengrep reads rule files as ASCII.
#
# The rule ids contain "secret" and "credential" on purpose: Achilles treats such
# findings as credentials, so their matched text is masked in every report and
# never sent to a model.
rules:
  - id: achilles.generic.credentials-in-url
    languages: [generic]
    severity: ERROR
    message: >
      A connection URL carries a user name and password. Anyone who can read the
      repository can use them. Read the URL, or at least the password, from the
      environment or a secret store, and rotate this one.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
    paths:
      exclude: ["*.md", "*.rst", "*.txt", "*.adoc", "docs/"]
    patterns:
      # Brackets are left out of the user and password: "[username[:password]@]" is
      # how documentation describes the syntax, not a credential.
      - pattern-regex: (?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@'"`\[\]]{1,64}:[^\s/@'"`\[\]]{4,128}@[a-z0-9.\-_\[\]]+
      # Placeholders and templating are not credentials.
      - pattern-not-regex: (?i)://[^\s:/@'"`]*:(\*+|x{3,}|password|passwd|pass|pwd|secret|changeme|change_me|example|placeholder|redacted|<[^>]*>|\$\{[^}]*\}|\$[a-z_][a-z0-9_]*|\{\{[^}]*\}\}|%s|%\([a-z_]+\)s|\{[a-z_]*\})@
      # Templating anywhere in the user or password, such as a shell default
      # (${DB_PASSWORD:-dev}), which the line above cannot see as one piece.
      - pattern-not-regex: ://[^\s/@'"`]*(\$\{|\{\{|\$[A-Za-z_]|%\()[^\s/@'"`]*@
      # A database or broker on this machine: a test or development credential.
      - pattern-not-regex: (?i)://[^\s/@'"`]+@(localhost|127\.0\.0\.1|\[::1\])(?=[:/'"`\s])

  - id: achilles.generic.hardcoded-secret
    languages: [generic]
    severity: ERROR
    message: >
      A secret-looking value is assigned to a name that says it is one (a key,
      token, secret or password). Anyone who can read the repository has it. Read it
      from the environment or a secret store, and rotate this one.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
    paths:
      # API descriptions (Swagger, OpenAPI) carry example values for every field.
      exclude: ["*.md", "*.rst", "*.txt", "*.adoc", "docs/", "*.lock", "package-lock.json", "go.sum", "*swagger*", "*openapi*"]
    patterns:
      - pattern-regex: (?i)\b[a-z0-9_.-]*(secret|api_?key|apikey|access_?key|private_?key|auth_?token|access_?token|signing_?key|client_?secret|passwd|password|token)[a-z0-9_]*["']?\s*(=|:|:=|=>)\s*["'][A-Za-z0-9_\-+/=.~]{16,}["']
      # A value that is only a placeholder, an example or a reference.
      - pattern-not-regex: (?i)(=|:|:=|=>)\s*["'](changeme|change_me|your[_-]?[a-z_-]*here|x{8,}|\*{8,}|0{8,}|example[a-z_-]*|test[a-z_-]*|dummy[a-z_-]*|fake[a-z_-]*|placeholder[a-z_-]*|redacted|not[_-]?a[_-]?(real[_-]?)?(secret|key|token))["']
      # Names that hold a reference to a secret, not the secret.
      - pattern-not-regex: (?i)\b[a-z0-9_.-]*(secret|key|token|password)_?(name|id|ref|path|file|env|var|header|field|url|endpoint|type|kind|length|len|size|prefix)["']?\s*(=|:|:=|=>)
      # Values shaped like identifiers, not secrets: lower-case words joined by
      # separators ("hardcoded-secret", "auth.token.field") and environment
      # variable names ("APP_API_TOKEN").
      - pattern-not-regex: (=|:|:=|=>)\s*["'][a-z]+([._-][a-z]+)+["']
      - pattern-not-regex: (=|:|:=|=>)\s*["'][A-Z][A-Z0-9]*(_[A-Z0-9]+)+["']
      # Scanning real code (Azure, AWS and Google SDKs, Envoy, goreleaser) found
      # these shapes, none of them secrets:
      # - letters only: enum values and type names ("ClientSecretCredential");
      - pattern-not-regex: (=|:|:=|=>)\s*["'][A-Za-z]+["']
      # - words joined by - . _ or /, each word letters with at most one digit:
      #   header names ("X-Amz-Security-Token"), paths and gRPC methods
      #   ("instance/service-accounts/default/token",
      #   "/envoy.service.secret.v3.SecretDiscoveryService/FetchSecrets"), dotted
      #   names ("oauth2.google.tokenSource"), file names ("~/.config/x/github_token");
      #   (Unambiguous, possessive quantifiers: an ambiguous version backtracked
      #   past PCRE's limit on a long near miss, and Opengrep then dropped this
      #   exclusion for the whole file.)
      #   Only when the value also has an upper-case letter, a "/" or a ".", which
      #   every one of those had: "hunter2-admin-pass" is a password.
      - pattern-not-regex: (=|:|:=|=>)\s*["'](?=[^"'\n]*[/.A-Z])(?:~|\.)?/?\.?[A-Za-z]++(?:[0-9][A-Za-z]*+)?(?:[-._/]++[A-Za-z]++(?:[0-9][A-Za-z]*+)?)++/?["']
      # - lower-case header names ("x-amz-s3session-token");
      - pattern-not-regex: (=|:|:=|=>)\s*["'][xX]-[A-Za-z0-9-]++["']
      # - placeholders ("__ClientSecret__") and truncated examples ("9cbaf0...");
      - pattern-not-regex: (=|:|:=|=>)\s*["']__[A-Za-z0-9_]+__["']
      - pattern-not-regex: (=|:|:=|=>)\s*["'][^"'\s]*\.\.\.[^"'\s]*["']
      # - Go's stringer output: the names of a type's values, run together
      #   (const _tokenkind_name = "niltokenerrtokeneoftoken...");
      - pattern-not-regex: \b_[A-Za-z0-9]+_name\s*=
      # - public keys and their tokens, which are published on purpose.
      - pattern-not-regex: (?i)\bpublic_?key[a-z0-9_]*["']?\s*(=|:|:=|=>)
