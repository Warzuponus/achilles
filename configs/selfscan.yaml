# Self-scan config: Achilles scanning its own Go code (dogfooding, CI).
# Only gosec is enabled here — it's the Go SAST engine. The default
# configs/tools.yaml keeps the broader multi-language set for scanning targets.
tools:
  - id: gosec
    license: Apache-2.0
    commercialSafe: true
    enabled: true
    languages: [go]
    image: ghcr.io/securego/gosec:2.27.1@sha256:d0859f242774504d57b17442b2dc77d4ffd2f4d30fbdf92c7eb612b2a394f477
    bin: gosec
    requires: [go]   # gosec type-checks via the Go toolchain; fail loudly if absent
    format: sarif
    argv: ["-fmt=sarif", "-out={out}/results.sarif", "-no-fail", "-exclude-dir=testdata", "{src}/..."]
    outputFile: "{out}/results.sarif"
    successExitCodes: [0]
    incompleteWhen: ["skipping SSA analysis"]   # see configs/tools.yaml

  # zizmor over Achilles' own workflows and action.yml (see configs/tools.yaml). On
  # here rather than opt-in: a change that weakens a workflow should fail this job
  # the way a new gosec finding does.
  - id: zizmor
    license: MIT
    commercialSafe: true
    enabled: true
    languages: [generic]
    image: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
    bin: zizmor
    format: sarif
    argv: ["--offline", "--no-progress", "--format", "sarif", "{src}"]
    outputFile: "{stdout}"
    successExitCodes: [0]
    nothingToScan: ["no inputs collected"]
    incompleteWhen: ["failed to parse input"]
    noRepoConfigArgs: ["--no-config"]
    repoConfig: [zizmor.yml, .github/zizmor.yml]
