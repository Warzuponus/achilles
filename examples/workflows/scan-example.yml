# Example: a fast per-PR gate with no LLM and no secrets. It annotates the diff and
# fails only on newly introduced high-severity findings. Fork PRs work too, because
# nothing here needs a secret. For AI-verified results and issues, see achilles.yml.
# Copy into a repo's .github/workflows/ (it does not run here).
name: Achilles PR gate (example)

on:
  pull_request:

permissions:
  contents: read
  security-events: write # only for upload-sarif; remove it and `upload-sarif` if you don't want the Security tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no step pushes with git; keep the token out of .git/config
          fetch-depth: 0 # needed for --diff against the base ref
      - uses: Warzuponus/achilles@v0.1.0
        with:
          fail-on: high
          upload-sarif: "true" # best-effort; skipped quietly where code scanning is unavailable
          # Only findings in files this PR changed, and only ones not in the committed baseline.
          args: >-
            --diff origin/${{ github.base_ref }}
            --baseline .achilles/baseline.json
