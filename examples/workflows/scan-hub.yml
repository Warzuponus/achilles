# Example: a central scan hub. Run an AI-verified Achilles scan of ANOTHER repository
# from one place, so the LLM key lives in a single repository and the targets need no
# secrets and no workflow of their own.
#
# This file does not run from examples/. Copy it to .github/workflows/scan-hub.yml in
# the repository you want to be the hub (a private repository of your own).
#
# Cross-repo READ is granted by a GitHub App (Contents: Read) installed on the target
# repositories; the workflow mints a short-lived installation token to check the
# target out. Results are uploaded as artifacts of THIS run. Nothing is written back
# to the target unless you tick `file_issues`, which mints a second token that also
# carries Issues: Write and files issues there. See DEPLOY.md -> "The scan hub".
#
# One-time setup in the hub repository (Settings -> Secrets and variables -> Actions):
#   secret   LLM_API_KEY               your LLM provider's API key
#   variable LLM_MODEL                 a model that provider serves
#   secret   SCANNER_APP_ID            the GitHub App's id
#   secret   SCANNER_APP_PRIVATE_KEY   the GitHub App's private key (.pem contents)
name: Achilles scan hub

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo to scan, name only (owner is this repository's owner)"
        required: true
      ref:
        description: "Branch/tag/SHA to scan (blank = default branch)"
        required: false
        default: ""
      file_issues:
        description: "Also open GitHub issues (with suggested fixes) in the target repo. Needs the App to have Issues: Write there."
        type: boolean
        required: false
        default: false

permissions:
  contents: read # only this repo; target access comes from the App token

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # 1. A short-lived token scoped to JUST the target repo (Contents: Read).
      - name: Mint target-scoped token
        id: tok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCANNER_APP_ID }}
          private-key: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target_repo }}

      # 2. Check the target out into ./target using that token.
      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.target_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.tok.outputs.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      # 2b. Only when asked to file issues: a second short-lived token that can also
      #     write issues on JUST the target repo. Needs Issues: Write on the App.
      - name: Mint issues-scoped token
        id: issues_tok
        if: ${{ inputs.file_issues }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCANNER_APP_ID }}
          private-key: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target_repo }}
          permission-contents: read
          permission-issues: write

      # 3. AI-verified scan of the target. The action uploads the report directory
      #    as the `achilles-report` artifact of this run.
      - name: Achilles scan
        uses: Warzuponus/achilles@v0.1.0
        with:
          target: "target"
          # `commercial` if you scan other people's code as a paid service: it
          # refuses tools that are not commercial-safe and skips the community rules.
          mode: "oss"
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-provider: openrouter # or openai | ollama; or set llm-base-url instead
          llm-model: ${{ vars.LLM_MODEL }}
          issues: ${{ inputs.file_issues }}
          github-token: ${{ steps.issues_tok.outputs.token || github.token }}
          # --repo names where issues are filed. To use a different model per task,
          # commit a routing file to the hub, check the hub out, and add
          # `--model-config <file>` (see configs/models.example.yaml).
          args: >-
            --repo ${{ github.repository_owner }}/${{ inputs.target_repo }}
